services:
  postgres:
    image: postgres:16-alpine
    container_name: parakh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parakh}
      POSTGRES_USER: ${POSTGRES_USER:-parakh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parakh_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parakh} -d ${POSTGRES_DB:-parakh}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - parakh-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parakh-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parakh}:${POSTGRES_PASSWORD:-parakh_password}@postgres:5432/${POSTGRES_DB:-parakh}
      SECRET_KEY: ${SECRET_KEY:-parakh-super-secret-key-change-in-production-0987654321}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ASSESSMENT_ENGINE: ${ASSESSMENT_ENGINE:-mock}
      DEBUG: "false"
      APP_ENV: production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - parakh-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: parakh-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: http://backend:8000
    networks:
      - parakh-network

volumes:
  postgres_data:
    name: parakh_postgres_data

networks:
  parakh-network:
    name: parakh_network
    driver: bridge
